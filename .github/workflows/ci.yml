name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (includes the TSDoc rule for exported functions)
        run: npm run lint
      - name: Typecheck (astro sync generates the content-collection types first)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # Without this cache every push re-crawls AMFI's expense-ratio pages for all fund houses (about 12 minutes).
      # With it, TER is refreshed only when the cache is older than 7 days. Saved even if a later step fails.
      - name: Restore data cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: ci-data-${{ github.run_id }}
          restore-keys: |
            ci-data-
            nav-cache-
      - name: Build a small real dataset (400 funds, polite to the free API)
        run: npm run data:build -- --limit=400 --rps=8
      - name: Save data cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: ci-data-${{ github.run_id }}
      - name: Build the site (30 fund pages) and check links / SEO basics
        run: |
          MAX_FUND_PAGES=30 npm run build
          node scripts/check-site.mjs --sample
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
