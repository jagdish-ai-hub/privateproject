name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (includes the TSDoc rule for exported functions)
        run: npm run lint
      - name: Typecheck (astro sync generates the content-collection types first)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build a small real dataset (150 funds, polite to the free API)
        run: npm run data:build -- --limit=150 --rps=5
      - name: Build the site (30 fund pages) and check links / SEO basics
        run: |
          MAX_FUND_PAGES=30 npm run build
          node scripts/check-site.mjs --sample
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
